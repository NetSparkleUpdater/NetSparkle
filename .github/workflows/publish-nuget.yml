name: Publish to NuGet
on: 
  push:
    branches:
      - "*"
  pull_request:
env:
  BUILD_CONFIGURATION: Release
# to update branch that publish happens on, edit the if: statement for the publish job
jobs:
  test:
    name: Unit testing
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Install NuGet / .NET on macOS as workaround
        run: |
         if [ "$RUNNER_OS" == "Linux" ]; then
            echo ''
         elif [ "$RUNNER_OS" == "Windows" ]; then
            echo ''
         else
            nuget help || brew install nuget -q
            softwareupdate --install-rosetta --agree-to-license
            wget https://dot.net/v1/dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --architecture arm64 --channel 10.0
            ./dotnet-install.sh --architecture x64 --channel 10.0
            ./dotnet-install.sh --architecture arm64 --channel 11.0
            ./dotnet-install.sh --architecture x64 --channel 11.0
         fi
        shell: bash
      - uses: actions/checkout@v7.0.1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0
        if: matrix.os == 'windows-latest'
      
      - name: Setup .NET 10.0, 11.0 for tests
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Run NetSparkle.Tests in .NET 4.7
        run: dotnet test -f net47 ${{ github.workspace }}/src/NetSparkle.Tests/NetSparkle.Tests.csproj
        if: matrix.os == 'windows-latest'

      - name: Run NetSparkle.Tests in .NET 10
        run: dotnet test -f net10.0 ${{ github.workspace }}/src/NetSparkle.Tests/NetSparkle.Tests.csproj

      - name: Run NetSparkle.Tests.AppCastGenerator in .NET 10
        run: dotnet test -f net10.0 ${{ github.workspace }}/src/NetSparkle.Tests.AppCastGenerator/NetSparkle.Tests.AppCastGenerator.csproj

      - name: Run NetSparkle.Tests in .NET 11
        run: dotnet test -f net11.0 ${{ github.workspace }}/src/NetSparkle.Tests/NetSparkle.Tests.csproj

      - name: Run NetSparkle.Tests.AppCastGenerator in .NET 11
        run: dotnet test -f net11.0 ${{ github.workspace }}/src/NetSparkle.Tests.AppCastGenerator/NetSparkle.Tests.AppCastGenerator.csproj

  build:
    name: Build all packages as smoke test
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0
      
      - name: Setup .NET 10.0, 11.0
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Clean things to be safe
        run: |
          dotnet clean ${{ github.workspace }}/src/NetSparkle/NetSparkle.csproj --configuration $env:BUILD_CONFIGURATION
          dotnet clean ${{ github.workspace }}/src/NetSparkle.UI.WinForms.NetCore/NetSparkle.UI.WinForms.NetCore.csproj --configuration $env:BUILD_CONFIGURATION
          dotnet clean ${{ github.workspace }}/src/NetSparkle.UI.WPF/NetSparkle.UI.WPF.csproj --configuration $env:BUILD_CONFIGURATION
          dotnet clean ${{ github.workspace }}/src/NetSparkle.Tools.AppCastGenerator/NetSparkle.Tools.AppCastGenerator.csproj --configuration $env:BUILD_CONFIGURATION
          dotnet clean ${{ github.workspace }}/src/NetSparkle.Tools.DSAHelper/NetSparkle.Tools.DSAHelper.csproj --configuration $env:BUILD_CONFIGURATION
          msbuild ${{ github.workspace }}/src/NetSparkle.UI.WinForms.NetFramework/NetSparkle.UI.WinForms.NetFramework.csproj /property:Configuration=$env:BUILD_CONFIGURATION /t:Clean /p:OutputPath=../../nuget/winformsnetframework/lib/net462

      - name: Build NetSparkle in ${{ env.BUILD_CONFIGURATION }}
        run: dotnet build ${{ github.workspace }}/src/NetSparkle/NetSparkle.csproj --configuration $env:BUILD_CONFIGURATION
      
      - name: Build NetSparkle.UI.WPF in ${{ env.BUILD_CONFIGURATION }}
        run: dotnet build ${{ github.workspace }}/src/NetSparkle.UI.WPF/NetSparkle.UI.WPF.csproj --configuration $env:BUILD_CONFIGURATION
      
      - name: Build NetSparkle.UI.Avalonia in ${{ env.BUILD_CONFIGURATION }}
        run: dotnet build ${{ github.workspace }}/src/NetSparkle.UI.Avalonia/NetSparkle.UI.Avalonia.csproj --configuration $env:BUILD_CONFIGURATION

      - name: Build NetSparkle.Tools.AppCastGenerator in ${{ env.BUILD_CONFIGURATION }}
        run: dotnet build ${{ github.workspace }}/src/NetSparkle.Tools.AppCastGenerator/NetSparkle.Tools.AppCastGenerator.csproj --configuration $env:BUILD_CONFIGURATION -m:1

      - name: Build NetSparkle.Tools.DSAHelper in ${{ env.BUILD_CONFIGURATION }}
        run: dotnet build ${{ github.workspace }}/src/NetSparkle.Tools.DSAHelper/NetSparkle.Tools.DSAHelper.csproj --configuration $env:BUILD_CONFIGURATION -m:1

      - name: Build NetSparkle.UI.WinForms.NetCore in ${{ env.BUILD_CONFIGURATION }}
        run: dotnet build ${{ github.workspace }}/src/NetSparkle.UI.WinForms.NetCore/NetSparkle.UI.WinForms.NetCore.csproj --configuration $env:BUILD_CONFIGURATION

      - name: Build NetSparkle.UI.WinForms.NetFramework in ${{ env.BUILD_CONFIGURATION }}
        run: |
          msbuild ${{ github.workspace }}/src/NetSparkle.UI.WinForms.NetFramework/NetSparkle.UI.WinForms.NetFramework.csproj /property:Configuration=$env:BUILD_CONFIGURATION /t:Restore /p:OutputPath=../../nuget/winformsnetframework/lib/net462 /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg
          msbuild ${{ github.workspace }}/src/NetSparkle.UI.WinForms.NetFramework/NetSparkle.UI.WinForms.NetFramework.csproj /property:Configuration=$env:BUILD_CONFIGURATION /p:OutputPath=../../nuget/winformsnetframework/lib/net462 /p:IncludeSymbols=true /p:SymbolPackageFormat=snupkg

  publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    name: Build and publish all packages to NuGet
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/avalonia-preview' || github.ref == 'refs/heads/versions/2.x'
    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
    steps:
      # Get a short-lived NuGet API key, see https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USERNAME}}

      - uses: actions/checkout@v7.0.1
      
      - name: Setup .NET 10.0, 11.0
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      
      - name: NetSparkleUpdater.SparkleUpdater
        uses: ./.github/actions/pack-and-publish-nuget
        with:
          project_path: src\NetSparkle\NetSparkle.csproj
          output_directory_name: NetSparkleUpdater.SparkleUpdater
          build_configuration: ${{ env.BUILD_CONFIGURATION }}
          nuget_source: ${{ env.NUGET_SOURCE }}
          nuget_api_key: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: NetSparkleUpdater.UI.WinForms.NetFramework
        uses: ./.github/actions/pack-and-publish-nuget
        with:
          project_path: src\NetSparkle.UI.WinForms.NetFramework\NetSparkle.UI.WinForms.NetFramework.csproj
          output_directory_name: NetSparkleUpdater.UI.WinForms.NetFramework
          build_configuration: ${{ env.BUILD_CONFIGURATION }}
          nuget_source: ${{ env.NUGET_SOURCE }}
          nuget_api_key: ${{ steps.login.outputs.NUGET_API_KEY }}
          disable_package_on_build: 'true'

      - name: NetSparkleUpdater.UI.WPF
        uses: ./.github/actions/pack-and-publish-nuget
        with:
          project_path: src\NetSparkle.UI.WPF\NetSparkle.UI.WPF.csproj
          output_directory_name: NetSparkleUpdater.UI.WPF
          build_configuration: ${{ env.BUILD_CONFIGURATION }}
          nuget_source: ${{ env.NUGET_SOURCE }}
          nuget_api_key: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: NetSparkleUpdater.UI.Avalonia
        uses: ./.github/actions/pack-and-publish-nuget
        with:
          project_path: src\NetSparkle.UI.Avalonia\NetSparkle.UI.Avalonia.csproj
          output_directory_name: NetSparkleUpdater.UI.Avalonia
          build_configuration: ${{ env.BUILD_CONFIGURATION }}
          nuget_source: ${{ env.NUGET_SOURCE }}
          nuget_api_key: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: NetSparkleUpdater.UI.WinForms.NetCore
        uses: ./.github/actions/pack-and-publish-nuget
        with:
          project_path: src\NetSparkle.UI.WinForms.NetCore\NetSparkle.UI.WinForms.NetCore.csproj
          output_directory_name: NetSparkleUpdater.UI.WinForms.NetCore
          build_configuration: ${{ env.BUILD_CONFIGURATION }}
          nuget_source: ${{ env.NUGET_SOURCE }}
          nuget_api_key: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: NetSparkleUpdater.Tools.DSAHelper
        uses: ./.github/actions/pack-and-publish-nuget
        with:
          project_path: src\NetSparkle.Tools.DSAHelper\NetSparkle.Tools.DSAHelper.csproj
          output_directory_name: NetSparkleUpdater.Tools.DSAHelper
          build_configuration: ${{ env.BUILD_CONFIGURATION }}
          nuget_source: ${{ env.NUGET_SOURCE }}
          nuget_api_key: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: NetSparkleUpdater.Tools.AppCastGenerator
        uses: ./.github/actions/pack-and-publish-nuget
        with:
          project_path: src\NetSparkle.Tools.AppCastGenerator\NetSparkle.Tools.AppCastGenerator.csproj
          output_directory_name: NetSparkleUpdater.Tools.AppCastGenerator
          build_configuration: ${{ env.BUILD_CONFIGURATION }}
          nuget_source: ${{ env.NUGET_SOURCE }}
          nuget_api_key: ${{ steps.login.outputs.NUGET_API_KEY }}
